<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    if (window.location.pathname.endsWith('/admin')) {
      window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Bhavan's Vivekananda Vidya Mandir, Manvila</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" type="image/png" href="../assets/images/bvb-manvila-logo.png">
</head>
<body>

  <div class="admin-login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <img src="../assets/images/bvb-manvila-logo.png" alt="BVB Manvila Logo" class="login-logo">
        <div class="header-logo-text" style="align-items: center;">
          <span class="logo-top-text" style="font-size: 1rem; color: var(--color-deep-blue);">Bharatiya Vidya</span>
          <span class="logo-title-bhavan" style="font-size: 2.3rem; color: var(--color-primary-blue, #0B4EA2);">Bhavan</span>
          <span class="logo-sub" style="margin-top: 4px; font-size: 0.725rem; font-weight: 700; color: var(--color-text-secondary); letter-spacing: 0.08em;">MANVILA, THIRUVANANTHAPURAM • CONTROL CENTER</span>
        </div>
      </div>

      <div id="loginAlert" style="display: none; padding: 0.75rem 1rem; margin-bottom: 1.25rem; border-radius: var(--radius-sm); font-size: 0.8125rem; font-weight: 600; text-align: center;"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label" for="loginUsername">Username / ID</label>
          <input type="text" id="loginUsername" class="form-control" placeholder="Enter administrative username" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required autocomplete="current-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="loginRoleSelect">Authentication Role Privilege</label>
          <select id="loginRoleSelect" class="form-select">
            <option value="super admin">Super Admin</option>
            <option value="admin">Admin</option>
            <option value="school">School</option>
          </select>
        </div>

        <button type="submit" class="btn-admin-primary" style="margin-top: 1.5rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
          LOGIN TO DASHBOARD
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center;">
        <a href="../index.html" style="font-size: 0.8125rem; color: var(--color-primary); font-weight: 600; text-decoration: none;">← Return to Public Website</a>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
